name: Build Package to use ncc
on:
  push:
    branches:
      - master
permissions:
  contents: write
jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Build node js module
        uses: ./
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
